name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentauth_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AGENTAUTH_TEST_REDIS_URL: redis://localhost:6379/0
      AGENTAUTH_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/agentauth_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test (unit, integration, adversarial, concurrency, Redis, PostgreSQL, end-to-end)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -ra --cov --cov-report=term --cov-report=xml --cov-fail-under=80 | tee pytest.txt
          # Nothing may be skipped here: the backends and the MCP SDK are all available in this job.
          ! grep -q "^SKIPPED" pytest.txt
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  # The declared lower bounds in pyproject.toml must actually work.
  test-minimum-versions:
    name: Tests (Python 3.10, minimum dependency versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install lowest direct dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[server,redis,postgres]" "pytest>=8" "httpx2>=2.13"
      - name: Test
        run: python -m pytest -q -m "not e2e"

  # The SDK must keep working for callers on plain httpx (no httpx2 installed).
  test-httpx-only:
    name: Tests (Python 3.12, httpx only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install without httpx2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,redis,postgres]" pytest
          ! python -c "import httpx2"
      - name: Test
        run: python -m pytest -q -m "not e2e"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Known vulnerabilities in the locked deployment dependencies
        run: pip-audit -r deploy/requirements.lock --require-hashes --progress-spinner off
      - name: Known vulnerabilities in the package's resolved dependencies
        run: |
          python -m pip install -e ".[all]"
          pip-audit --skip-editable --progress-spinner off
      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r agentauth

  lockfile:
    name: Locked dependencies install cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install from the lock with hash checking
        run: |
          python -m venv /tmp/lock
          /tmp/lock/bin/pip install --require-hashes -r deploy/requirements.lock
          /tmp/lock/bin/pip install --no-deps .
          /tmp/lock/bin/pip check

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install "$(ls dist/*.whl)[server]"
          cd /tmp && /tmp/wheel/bin/agentauth version
          /tmp/wheel/bin/python -c "import agentauth, agentauth.server, agentauth.asgi; print(agentauth.__version__)"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t agentauth-registry:ci .
      - name: Smoke test
        run: |
          docker run -d --name reg -p 8000:8000 -e AGENTAUTH_AUDIENCES=localhost:8000 agentauth-registry:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/readyz && break; sleep 1; done
          curl -fsS localhost:8000/readyz
          test "$(docker inspect -f '{{.Config.User}}' agentauth-registry:ci)" = "agentauth"
          docker logs reg
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q
