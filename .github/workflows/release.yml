name: release

# Runs when a GitHub release is published (e.g. `gh release create v0.4.0 ...`).
# 1. build:   builds the sdist and wheel, checks them, and checks the tag matches the version
# 2. publish: uploads to PyPI with trusted publishing (no stored token). One-time setup: on
#             pypi.org add a trusted publisher for invarislabs/agent-auth, workflow release.yml,
#             environment "pypi"; in the repo settings create the "pypi" environment, ideally
#             with required reviewers.
# 3. image:   builds the registry image and pushes it to ghcr.io/invarislabs/agent-auth
#             tagged with the version and "latest".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Tag must match the package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          code="$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("agentauth/__init__.py").read()).group(1))')"
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $version  agentauth.__version__: $code  tag: $tag"
          test "$version" = "$code" && test "$version" = "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install "$(ls dist/*.whl)[server]"
          cd /tmp && /tmp/wheel/bin/agentauth version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/invaris-agentauth/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write          # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io
    env:
      IMAGE: ghcr.io/invarislabs/agent-auth
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
      - name: Smoke test
        run: |
          docker run -d --name reg -p 8000:8000 -e AGENTAUTH_AUDIENCES=localhost:8000 "$IMAGE:$VERSION"
          for i in $(seq 1 30); do curl -fsS localhost:8000/readyz && break; sleep 1; done
          curl -fsS localhost:8000/readyz
          curl -fsS localhost:8000/v1/info
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
