[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentauth"
version = "0.3.0"
description = "Self-certifying, rotatable identities for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["agentauth[server]", "pytest>=8"]

[project.scripts]
agentauth = "agentauth.cli:main"

[tool.setuptools]
packages = ["agentauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
